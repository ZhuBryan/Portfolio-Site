<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1aa8b8"/>
      <stop offset="100%" stop-color="#053b4d"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- a plain, easy background: one calm horizon wave + a couple of bubbles -->
  <path d="M0 46 C 10 42, 20 50, 32 46 C 44 42, 54 50, 64 46 L64 64 L0 64 Z"
        fill="#ffffff" opacity="0.07"/>
  <circle cx="12" cy="14" r="2" fill="#ffffff" opacity="0.18"/>
  <circle cx="19" cy="9" r="1.2" fill="#ffffff" opacity="0.16"/>

  <!-- BZ monogram -->
  <text
    x="32" y="40"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="27"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#f3fffd"
  >BZ</text>
</svg>
