<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b7e7a"/>
      <stop offset="55%" stop-color="#0ea5a0"/>
      <stop offset="100%" stop-color="#34d2c0"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1fbf9a"/>
      <stop offset="100%" stop-color="#15967e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- satellite land patches -->
  <path d="M180 140 q120 -50 240 10 q90 45 60 140 q-25 80 -130 85 q-130 6 -190 -70 q-50 -65 20 -165z" fill="url(#land)" opacity="0.85"/>
  <path d="M820 380 q140 -40 230 40 q80 70 30 160 q-45 80 -170 60 q-125 -20 -150 -110 q-22 -90 60 -150z" fill="url(#land)" opacity="0.7"/>
  <!-- deforestation heat zone -->
  <circle cx="370" cy="250" r="70" fill="#ff8a5c" opacity="0.55"/>
  <circle cx="370" cy="250" r="40" fill="#ff5c47" opacity="0.7"/>
  <!-- scan grid -->
  <g stroke="#eafffb" stroke-width="1.5" opacity="0.28">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280M0 600h1280"/>
    <path d="M160 0v720M320 0v720M480 0v720M640 0v720M800 0v720M960 0v720M1120 0v720"/>
  </g>
  <!-- detection reticle -->
  <g fill="none" stroke="#ffffff" stroke-width="6">
    <path d="M270 150 h-60 v60 M470 150 h60 v60 M270 350 h-60 v-60 M470 350 h60 v-60"/>
  </g>
  <rect x="218" y="96" width="190" height="40" rx="20" fill="#093a4d" opacity="0.85"/>
  <text x="240" y="123" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#7ff0d4">94% · deforestation</text>
  <!-- title -->
  <text x="72" y="610" font-family="Georgia, serif" font-size="76" font-weight="600" fill="#ffffff">VANTAGE</text>
  <text x="74" y="652" font-family="system-ui, sans-serif" font-size="26" fill="#d8fff6">Satellite land-use audit · ResNet-18 + Grad-CAM</text>
</svg>
