<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b34c4"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c4a8ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- mel spectrogram columns -->
  <g opacity="0.85">
    <g fill="#3a1f86">
      <rect x="120" y="420" width="44" height="160" rx="10"/>
      <rect x="180" y="350" width="44" height="230" rx="10"/>
      <rect x="240" y="280" width="44" height="300" rx="10"/>
      <rect x="300" y="380" width="44" height="200" rx="10"/>
      <rect x="360" y="240" width="44" height="340" rx="10"/>
      <rect x="420" y="320" width="44" height="260" rx="10"/>
      <rect x="480" y="180" width="44" height="400" rx="10"/>
      <rect x="540" y="300" width="44" height="280" rx="10"/>
      <rect x="600" y="260" width="44" height="320" rx="10"/>
      <rect x="660" y="360" width="44" height="220" rx="10"/>
      <rect x="720" y="300" width="44" height="280" rx="10"/>
      <rect x="780" y="430" width="44" height="150" rx="10"/>
    </g>
    <g fill="#ffd1a3">
      <rect x="360" y="240" width="44" height="120" rx="10"/>
      <rect x="480" y="180" width="44" height="150" rx="10"/>
      <rect x="600" y="260" width="44" height="110" rx="10"/>
    </g>
  </g>
  <!-- waveform line -->
  <path d="M120 140 q40 -60 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <!-- prediction chip -->
  <rect x="880" y="240" width="300" height="120" rx="22" fill="#2c1769" opacity="0.92"/>
  <text x="908" y="290" font-family="system-ui, sans-serif" font-size="26" fill="#c9b3ff">prediction</text>
  <text x="908" y="334" font-family="Georgia, serif" font-size="40" font-weight="600" fill="#ffffff">cello · 98%</text>
  <!-- title -->
  <text x="72" y="610" font-family="Georgia, serif" font-size="72" font-weight="600" fill="#ffffff">Instrument Classifier</text>
  <text x="74" y="652" font-family="system-ui, sans-serif" font-size="26" fill="#e6dcff">4-layer CNN on mel spectrograms · 2000+ samples</text>
</svg>
