<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- faint app chrome behind the assistant -->
  <g opacity="0.35">
    <rect x="110" y="150" width="520" height="26" rx="6" fill="#ffffff"/>
    <rect x="110" y="200" width="360" height="16" rx="6" fill="#ffffff"/>
    <rect x="110" y="230" width="420" height="16" rx="6" fill="#ffffff"/>
    <rect x="110" y="260" width="300" height="16" rx="6" fill="#ffffff"/>
  </g>
  <!-- highlighted UI target the assistant is pointing at -->
  <rect x="110" y="330" width="230" height="70" rx="12" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 8" opacity="0.9"/>
  <!-- pointer arc from chat to target -->
  <path d="M700 470 C 520 460, 380 430, 300 400" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <!-- chat bubble -->
  <g>
    <rect x="700" y="330" width="420" height="180" rx="24" fill="#1e1b4b" opacity="0.92"/>
    <path d="M760 510 l0 34 34 -34 z" fill="#1e1b4b" opacity="0.92"/>
    <rect x="732" y="362" width="356" height="14" rx="7" fill="#c7d2fe"/>
    <rect x="732" y="392" width="300" height="14" rx="7" fill="#c7d2fe"/>
    <rect x="732" y="422" width="240" height="14" rx="7" fill="#a5b4fc"/>
    <rect x="732" y="458" width="150" height="26" rx="8" fill="#818cf8"/>
    <text x="748" y="476" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e1b4b">Highlight it</text>
  </g>
  <!-- title -->
  <text x="72" y="610" font-family="Georgia, serif" font-size="72" font-weight="600" fill="#ffffff">RunBook</text>
  <text x="74" y="652" font-family="system-ui, sans-serif" font-size="26" fill="#e0e7ff">Grounded chat that guides, not just answers</text>
</svg>
